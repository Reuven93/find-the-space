      late: 'Too slow! The ball got there before you did!', yes: 'Yes! Nailed it.', no: 'Not quite, but nice try.' },
    { id: 'gus', name: 'Coach Gus', kind: 'Old-school legend', skin: '#E8B98F',
      beard: '<path d="M13 40c0 12 8 18 19 18s19-6 19-18c-3 5-7 7-10 6-3-1-5-2-9-2s-6 1-9 2c-3 1-7-1-10-6z" fill="#EEF1F4" stroke="#1A2330" stroke-width="2" stroke-linejoin="round"/>',
      top: '<path d="M12 30c1-10 9-16 20-16 10 0 17 4 21 11l5 3c-1 2-3 3-6 3H12z" fill="#6B6F76" stroke="#1A2330" stroke-width="2.2" stroke-linejoin="round"/>',
      extra: '<path d="M20 32h9M35 32h9" stroke="#EEF1F4" stroke-width="3.2" stroke-linecap="round"/>',
      hello: 'Hello there. I’ve seen a lot of football. Let’s get to work.',
      great: ['Lovely, {n}. That’s proper football.', 'Top drawer, {n}. Well played.', 'Smashing, {n}. Just like the old days.'],
      close: ['Close, {n}. Nearly there.', 'Good effort. One more go.'],
      miss: ['Back to it. Every great player misses.', 'Go again. That’s how you learn.'],
      late: 'Too slow: the ball arrived. Be ready before it comes.', yes: 'Yes, that’s the one.', no: 'Not quite.' },
  ];
  window.FTS = { ACADEMIES, COACHES };  // the browser tests read these
  const academyOf = (id) => ACADEMIES.find((a) => a.id === id) || null;
  const coachOf = (id) => COACHES.find((c) => c.id === id) || COACHES[0];

  // A crest: a shield in the academy's colours with a simple animal on it.
  function crestArt(a) {
    const sh = 'M50 7L88 18V50C88 72 72 87 50 95C28 87 12 72 12 50V18Z';
    let animal;
    if (a.animal === 'lion') {
      const pts = [];
      for (let k = 0; k < 18; k++) { const ang = (k / 18) * Math.PI * 2, r = k % 2 ? 19 : 26; pts.push(`${(50 + Math.cos(ang) * r).toFixed(1)},${(53 + Math.sin(ang) * r).toFixed(1)}`); }
      animal = `<polygon points="${pts.join(' ')}" fill="${a.ink}"/><circle cx="50" cy="53" r="14" fill="${a.shirt}"/><circle cx="45" cy="50" r="2.2" fill="${a.ink}"/><circle cx="55" cy="50" r="2.2" fill="${a.ink}"/><path d="M46 57h8l-4 5z" fill="${a.ink}"/>`;
    } else if (a.animal === 'wolf') {
      animal = `<path d="M30 26L42 41H58L70 26L68 50L50 78L32 50Z" fill="${a.ink}" stroke="${a.ink}" stroke-linejoin="round"/><circle cx="42" cy="52" r="2.6" fill="${a.shirt}"/><circle cx="58" cy="52" r="2.6" fill="${a.shirt}"/><circle cx="50" cy="69" r="3.2" fill="${a.shirt}"/>`;
    } else if (a.animal === 'eagle') {
      animal = `<path d="M14 46C26 34 40 38 50 48C60 38 74 34 86 46C76 46 66 52 59 62L50 79L41 62C34 52 24 46 14 46Z" fill="${a.ink}"/><circle cx="50" cy="39" r="9" fill="${a.ink}"/><circle cx="53" cy="37" r="2" fill="${a.shirt}"/><path d="M57.5 38L65 41.5L57.5 44Z" fill="#FFFFFF"/>`;
    } else {
      animal = `<path d="M28 30L37 20L44 38H56L63 20L72 30L68 52L50 77L32 52Z" fill="${a.ink}" stroke="${a.ink}" stroke-linejoin="round"/><path d="M36 51L50 71L64 51L50 46Z" fill="${a.shirt}"/><circle cx="42" cy="45" r="2.6" fill="${INK}"/><circle cx="58" cy="45" r="2.6" fill="${INK}"/><circle cx="50" cy="73" r="3" fill="${INK}"/>`;
    }
    return `<path d="${sh}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="9" stroke-linejoin="round"/><path d="${sh}" fill="${a.shirt}" stroke="${a.trim}" stroke-width="5" stroke-linejoin="round"/>${animal}`;
  }
  // A coach's face, with a mood: neutral, happy, think or oops.
  function coachArt(c, mood) {
    const eyes = mood === 'happy' ? `<path d="M21.5 39q3.5-4.5 7 0M35.5 39q3.5-4.5 7 0" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`
      : mood === 'oops' ? `<g stroke="${INK}" stroke-width="1.6" fill="#fff"><circle cx="25" cy="38" r="3.2"/><circle cx="39" cy="38" r="3.2"/></g><circle cx="25" cy="38.5" r="1.4" fill="${INK}"/><circle cx="39" cy="38.5" r="1.4" fill="${INK}"/>`
      : `<circle cx="25" cy="38" r="2.4" fill="${INK}"/><circle cx="39" cy="38" r="2.4" fill="${INK}"/>`;
    const mouth = mood === 'happy' ? `<path d="M24 45.5q8 8.5 16 0z" fill="#6A1E1E" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>`
      : mood === 'think' ? `<path d="M27 48.5q5-2.5 10 0" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/><path d="M35 29.5q4-3 8-1" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`
      : mood === 'oops' ? `<ellipse cx="32" cy="48.5" rx="3" ry="3.8" fill="#6A1E1E" stroke="${INK}" stroke-width="2"/>`
      : `<path d="M25 46c4 4 10 4 14 0" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
    return `<circle cx="32" cy="36" r="20" fill="${c.skin}" stroke="${INK}" stroke-width="2.5"/>${c.beard || ''}${c.top}${eyes}${c.extra || ''}${mouth}`;
  }

  let player = null, draft = null;
  try {
    const d = JSON.parse(localStorage.getItem(PLAYER_KEY) || 'null');
    if (d && typeof d.name === 'string' && Number.isInteger(d.num)) {
      player = { name: d.name.slice(0, 12), num: Math.max(1, Math.min(99, d.num)),
        academy: academyOf(d.academy) ? d.academy : null,
        coach: COACHES.some((c) => c.id === d.coach) ? d.coach : null,
        fav: typeof d.fav === 'string' ? d.fav.slice(0, 20) : '' };
    }
  } catch (e) { player = null; }
  // A save from before academies keeps his name and number, and asks once for the rest.
  const needsSetup = () => !player || !player.academy || !player.coach;
  const playerName = () => (player && player.name.trim()) || 'Player';
  const playerNum = () => (player ? player.num : pz.youN);
  function applyAcademy(id) {
    const a = academyOf(id) || ACADEMIES[1], r = document.documentElement;
    r.style.setProperty('--us', a.shirt);
    r.style.setProperty('--them', a.them);
    r.classList.toggle('kit-light', !!a.light);
  }
  function setCoach(mood) {
    const c = coachOf(player && player.coach), art = coachArt(c, mood);
    document.querySelectorAll('.coach-face').forEach((s) => { s.innerHTML = art; s.dataset.coach = c.id; s.dataset.mood = mood; });
    $('coach-tag').textContent = c.name;
  }
  function syncMe() {
    $('me-name').textContent = playerName();
    $('me-num').textContent = player ? player.num : 8;
    const a = player && academyOf(player.academy);
    $('me-crest').innerHTML = a ? crestArt(a) : '';
    $('me-crest').toggleAttribute('hidden', !a);
    const total = starsIn(E.PUZZLES.map((_, i) => i));
    $('me-lv').textContent = `${levelOf(total).name} · ★ ${total}`;
  }
  function syncCard() {
    $('pc-num').textContent = draft.num; $('pc-shirt-num').textContent = draft.num; $('p-num').textContent = draft.num;
    $('pc-name').textContent = draft.name.trim() || 'Your name';
    $('pc-lv').textContent = levelOf(starsIn(E.PUZZLES.map((_, i) => i))).name;
    const a = academyOf(draft.academy), c = draft.coach ? coachOf(draft.coach) : null, fav = draft.fav.trim();
    $('pc-crest').innerHTML = a ? crestArt(a) : '';
    $('pc-ac').textContent = a ? a.name : 'Pick your academy';
    $('pc-fav').hidden = !fav; $('pc-fav').textContent = `♥ ${fav}`;
    applyAcademy(draft.academy);
    $('academies').querySelectorAll('.pick').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.academy === draft.academy)));
    $('coaches').querySelectorAll('.pick').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.coach === draft.coach)));
    $('co-hello').hidden = !c;
    if (c) $('co-hello').textContent = `${c.name}: “${c.hello}”`;
    const ready = !!(a && c);
    $('make-go').disabled = !ready; $('make-need').hidden = ready;
  }
  function openMake() {
    if (anim) return;
    state = 'make';
    draft = player ? { ...player } : { name: '', num: 8, academy: null, coach: null, fav: '' };
    $('p-name').value = draft.name; $('p-fav').value = draft.fav;
    $('make-cancel').hidden = needsSetup();
    show('make'); syncCard();
  }
  for (const a of ACADEMIES) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pick'; b.dataset.academy = a.id; b.setAttribute('role', 'radio');
    b.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">${crestArt(a)}</svg><span class="pick-name"></span>`;
    b.querySelector('.pick-name').textContent = a.name;
    b.addEventListener('click', () => { draft.academy = a.id; syncCard(); });
    $('academies').appendChild(b);
  }
  for (const c of COACHES) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pick'; b.dataset.coach = c.id; b.setAttribute('role', 'radio');
    b.innerHTML = `<svg viewBox="3 8 58 52" aria-hidden="true">${coachArt(c, 'happy')}</svg><span class="pick-name"></span><span class="pick-sub"></span>`;
    b.querySelector('.pick-name').textContent = c.name;
    b.querySelector('.pick-sub').textContent = c.kind;
    b.addEventListener('click', () => { draft.coach = c.id; syncCard(); unlockSpeech(); say(`${c.name}. ${c.hello}`); });
    $('coaches').appendChild(b);
  }
  $('p-name').addEventListener('input', () => { draft.name = $('p-name').value.slice(0, 12); syncCard(); });
  $('p-fav').addEventListener('input', () => { draft.fav = $('p-fav').value.slice(0, 20); syncCard(); });
  $('num-down').addEventListener('click', () => { draft.num = draft.num <= 1 ? 99 : draft.num - 1; syncCard(); });
  $('num-up').addEventListener('click', () => { draft.num = draft.num >= 99 ? 1 : draft.num + 1; syncCard(); });
  $('make-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!draft.academy || !draft.coach) return;
    player = { name: draft.name.trim().slice(0, 12), num: draft.num, academy: draft.academy, coach: draft.coach, fav: draft.fav.trim().slice(0, 20) };
    try { localStorage.setItem(PLAYER_KEY, JSON.stringify(player)); } catch (err) { /* private mode: keep it for this visit */ }
    $('p-name').blur(); $('p-fav').blur();
    showHome(); say(homeSpeech());
  });
  $('make-cancel').addEventListener('click', () => { applyAcademy(player.academy); showHome(); });
  $('me').addEventListener('click', openMake);
  applyAcademy(player && player.academy);

  // ---------- flow ----------
  function prep(i) {
    idx = i; pz = E.PUZZLES[i]; you = { ...pz.you };
    res = null; hint = false; extra = false; shownYou = null;
    pick = null; scanned = false; stance = null; path = [];
    svg.classList.remove('cheer');
  }
  function load(i, mode) {
    if (anim) return;
    stopClock();
    prep(i);
    sec = mode || pz.section; state = 'setup';
    drawPlayers(); render(); showSetup();
    say(setupSpeech());
  }

  function check(force) {
    if (waiting && state === 'setup' && !anim) { startClock(); return; }
    if (state !== 'setup' || anim || (force !== true && !T().ready())) return;
    unlockSpeech();
    const late = force === true;
    stopClock();
    T().submit();
    if (late) res.late = true;
    state = 'playing'; tried[idx] = true;
    best[idx] = Math.max(best[idx], res.stars);
    if (sec === 'match') matchStars[idx] = res.stars;
    saveProgress(); markSeen(pz.id);
    render();
    T().play(() => {
      state = 'result';
      render();
      T().final();
      if (res.stars === 3) { svg.classList.add('cheer'); confetti(false); }
      showResult();
      say(resultSpeech());
    });
  }

  function tryAgain() {
    if (anim) return;
    stopClock();
    state = 'setup'; res = null; extra = false; shownYou = null;
    if (pz.type === 'scan') { scanned = false; stance = null; }
    if (pz.type === 'pass' || pz.type === 'choice') pick = null;
    svg.classList.remove('cheer');
    drawPlayers(); render(); showSetup();
    svg.focus({ preventScroll: true });
  }

  function replayResult() {
    if (anim || state !== 'result') return;
    shownYou = null;
    drawPlayers(); render();
    T().play(() => T().final());
  }

  // ---------- input ----------
  function toModel(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  svg.addEventListener('pointerdown', (e) => {
    if (anim || waiting) return;
    const p = toModel(e);
    if (state === 'result' && extra && T().extraTap) { T().extraTap(p); return; }
    if (state !== 'setup' || !T().down) return;
    svg.setPointerCapture(e.pointerId);
    T().down(p);
    e.preventDefault();
  });
  svg.addEventListener('pointermove', (e) => { if (dragging && state === 'setup' && T().move) T().move(toModel(e)); });
  const stop = () => { dragging = false; };
  svg.addEventListener('pointerup', stop);
  svg.addEventListener('pointercancel', stop);
  svg.addEventListener('keydown', (e) => {
    if (state !== 'setup' || waiting) return;
    const k = { ArrowLeft: [-.5, 0], ArrowRight: [.5, 0], ArrowUp: [0, -.5], ArrowDown: [0, .5] }[e.key];
    if (k && pz.type === 'space') { moveYou({ x: you.x + k[0], y: you.y + k[1] }); e.preventDefault(); }
    else if (pz.type === 'scan' && (e.key === 's' || e.key === 'S')) { doScan(); e.preventDefault(); }
    else if (pz.type === 'scan' && ['1', '2', '3'].includes(e.key)) { setStance(E.STANCES[+e.key - 1]); e.preventDefault(); }
    else if (e.key === 'Enter') { check(); e.preventDefault(); }
  });

  $('check').addEventListener('click', check);
  $('hint').addEventListener('click', () => {
    if (state !== 'setup') return;
    hint = !hint; render();
    $('hint').setAttribute('aria-pressed', String(hint));
  });
  $('again').addEventListener('click', tryAgain);
  $('next').addEventListener('click', () => {
    if (anim) return;
    const list = listOf(sec), k = list.indexOf(idx);
    if (k < list.length - 1) load(list[k + 1], sec === 'match' ? 'match' : undefined); else showSectionEnd();
  });
  $('extra').addEventListener('click', () => {
    if (anim) return;
    extra = !extra;
    render(); T().final(true);
    syncExtra();
  });
  $('replay-pass').addEventListener('click', replayResult);
  $('replay').addEventListener('click', () => (sec === 'match' ? startMatch() : load(listOf(sec)[0])));
  $('match').addEventListener('click', startMatch);
  $('back').addEventListener('click', () => { showHome(); say(homeSpeech()); });
  $('to-home').addEventListener('click', () => { showHome(); say(homeSpeech()); });
  $('next-skill').addEventListener('click', () => {
    const go = $('next-skill').dataset.go;
    if (go === 'match') startMatch();
    else if (go) load(continueIndex(go)); else { showHome(); say(homeSpeech()); }
  });
  // Two taps to clear, so a stray tap can't wipe his stars.
  $('reset').addEventListener('click', () => {
    if (!resetArmed) {
      resetArmed = true;
      $('reset').textContent = 'Tap again to clear all stars';
      resetTimer = setTimeout(() => { resetArmed = false; $('reset').textContent = 'Clear my stars'; }, 4000);
      return;
    }
    best.fill(0); tried.fill(false); saveProgress(); initTiers(true);
    try { localStorage.removeItem(CHALLENGE_KEY); } catch (e) { /* nothing saved */ }
    showHome();
  });

  // ---------- read aloud (the device's own voice; nothing leaves the iPad) ----------
  const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  let narrate = false, voice = null, unlocked = false;
  try { narrate = canSpeak && localStorage.getItem('fts-narrate') === '1'; } catch (e) { narrate = false; }
  function pickVoice() {
    const junk = /novelty|bells|bad news|good news|whisper|zarvox|trinoids|albert|bahh|boing|bubbles|cellos|deranged|hysterical|jester|organ|superstar|wobble|junior|ralph|fred|kathy|grandpa|grandma|rocko|shelley|flo|eddy|reed|sandy/i;
    const score = (v) => (/^en/i.test(v.lang) ? 20 : 0) + (/en[-_](ZA|GB|AU|IE|NZ)/i.test(v.lang) ? 4 : /en[-_]US/i.test(v.lang) ? 3 : 0)
      + (/enhanced|premium|natural|neural/i.test(v.name) ? 5 : 0) + (/samantha|daniel|karen|tessa|serena|moira|google uk/i.test(v.name) ? 2 : 0)
      + (v.localService ? 1 : 0) - (junk.test(v.name) ? 50 : 0);
    const vs = speechSynthesis.getVoices();
    voice = vs.length ? vs.slice().sort((a, b) => score(b) - score(a))[0] : null;
  }
  function say(text) {
    if (!narrate || !canSpeak || !text) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; }
      u.rate = 0.95; u.pitch = 1.05;
      speechSynthesis.speak(u);
    } catch (e) { /* speech is a nice-to-have */ }
  }
  // iPad only lets a page talk after a tap, so the first tap wakes the voice up.
  function unlockSpeech() {
    if (!narrate || unlocked || !canSpeak) return;
    unlocked = true;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  }
  const setupSpeech = () => {
    const opts = pz.type === 'choice' ? pz.options.map((o) => o.label) : null;
    return `${pz.title}. ${pz.prompt}${opts ? ` Your choices: ${opts.slice(0, -1).join(', ')}, or ${opts[opts.length - 1]}.` : ''}${pz.countdown ? ` You have ${pz.countdown} seconds. Tap Start the clock when you’re ready.` : ''}`;
  };
  function resultSpeech() {
    const head = ['No stars this time.', 'One star.', 'Two stars.', 'Three stars! Brilliant.'][res.stars];
    const fixes = res.checks.filter((c) => !c.ok).map((c) => c.why).join(' ');
    if (!pz.ask) return `${head} ${fixes} Coach says: ${pz.teach}`;
    const opts = askOptions().map((o) => o.t);
    return `${head} ${fixes} Coach asks: ${pz.ask.q} Is it: ${opts.slice(0, -1).join(', ')}, or ${opts[opts.length - 1]}?`;
  }
  function endSpeech() {
    const sc = E.SECTIONS.find((x) => x.id === sec), list = listOf(sec), t = starsIn(list), max = list.length * 3;
    return `${sc.title}, done. You got ${t} of ${max} stars. ${t === max ? 'Perfect! ' : ''}Great work. Get ready for the game: ${sc.challenge}`;
  }
  const homeSpeech = () => `${$('home-sub').textContent} ${E.SECTIONS.map((x) => x.title).join('. ')}.`;
  const makeSpeech = () => 'Make your player. Type your name, pick your shirt number, your academy and your coach.';
  const currentSpeech = () => (state === 'make' ? makeSpeech() : state === 'home' ? homeSpeech() : state === 'end' && sec !== 'match' ? endSpeech() : state === 'end' ? 'Full time!' : state === 'result' ? resultSpeech() : setupSpeech());
  const nb = $('narrate');
  if (canSpeak) {
    nb.hidden = false;
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }
  const syncNarrate = () => nb.setAttribute('aria-pressed', String(narrate));
  syncNarrate();
  nb.addEventListener('click', () => {
    narrate = !narrate;
    try { localStorage.setItem('fts-narrate', narrate ? '1' : '0'); } catch (e) { /* private mode */ }
    syncNarrate();
    if (narrate) { unlocked = true; say(currentSpeech()); } else if (canSpeak) speechSynthesis.cancel();
  });
  document.addEventListener('pointerdown', (e) => {
    if (narrate && !unlocked && e.target !== nb && !nb.contains(e.target)) { unlocked = true; say(currentSpeech()); }
  }, { capture: true });

  const sb = $('sound');
  const syncSound = () => sb.setAttribute('aria-pressed', String(soundOn));
  syncSound();
  sb.addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) { /* private mode */ }
    syncSound();
    if (soundOn) sfx('star', 0);
  });
  // iPad only lets a page make sound after a tap, so every tap wakes the audio up.
  document.addEventListener('pointerdown', () => { if (soundOn) audio(); }, { capture: true });

  loadProgress();
  initTiers();
  showHome();
  if (needsSetup()) openMake();  // first visit, or a save from before academies: make his player first
})();

</script>
</body>
</html>
