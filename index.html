<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the space</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Collector-card look: a floodlit training ground at night; every skill is a player card that
   upgrades bronze → silver → gold as stars come in. One dark look on purpose. */
:root {
  --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body: Barlow, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --ground: #0B2416; --felt-1: #0E2C1B; --felt-2: #0C2717;
  --panel: rgba(2, 12, 6, .5); --edge: rgba(227, 179, 65, .55);
  --text: #F6F2E4; --muted: #C5D6C2; --cream: #FFF8E3; --cream-ink: #2A1C00;
  --gold: #E3B341; --gold-hi: #FFE38A; --gold-deep: #6E4A06;
  --gold-grad: linear-gradient(150deg, #FFF1B0, #E3B341 35%, #B07A12 66%, #FFE38A);
  --silver-grad: linear-gradient(150deg, #FFFFFF, #C9D1DB 35%, #8A96A6 66%, #E9EEF3);
  --bronze-grad: linear-gradient(150deg, #FFD9B8, #C9773A 40%, #8A4A1C 70%, #E8A877);
  --new-grad: linear-gradient(150deg, #44586D, #1D2733 70%, #2D3B4A);
  --card-ink: #2A1C00; --new-ink: #F6F2E4;
  --ok: #3DD68C; --bad: #FF6B81; --focus: #FFE38A;
  --us: #2F6BFF; --them: #FF5A36; --you: #FFD23F; --you-ink: #1A2330; --you-edge: #D9A21F;
  --shirt-edge: #FFFFFF;
  --grass-1: #2E8A41; --grass-2: #287D3A; --runoff: #123D22; --chalk: #F3F7EE;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; height: 100%; color: var(--text); font-family: var(--body); font-weight: 500;
  background: radial-gradient(1100px 620px at 50% -18%, #1E5A34, transparent 70%),
              repeating-linear-gradient(90deg, var(--felt-1) 0 90px, var(--felt-2) 90px 180px), var(--ground);
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; }
.screen { height: 100%; display: flex; flex-direction: column; min-height: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- shared pieces ---------- */
.coach-face { width: 60px; height: 60px; flex: none; }
.bubble { margin: 0; background: var(--cream); color: var(--cream-ink); border-radius: 18px; padding: 12px 16px;
  font-size: 18px; line-height: 1.4; position: relative; text-wrap: pretty; }
.bubble strong { font-weight: 700; }
.cta { appearance: none; border: 0; width: 100%; min-height: 72px; border-radius: 16px; padding: 8px 16px;
  background: var(--gold-grad); color: var(--card-ink); font-family: var(--display); font-size: 36px; letter-spacing: 1.5px; line-height: 1;
  box-shadow: 0 6px 0 var(--gold-deep), 0 10px 24px rgba(0, 0, 0, .35); transition: transform .08s, box-shadow .08s, filter .15s; }
.cta:hover { filter: brightness(1.06); }
.cta:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--gold-deep); }
.cta:disabled { filter: grayscale(.85) brightness(.75); box-shadow: 0 6px 0 #2B2B2B; cursor: default; transform: none; }
.ghost-btn { appearance: none; min-height: 60px; border-radius: 16px; border: 2px solid var(--edge); background: rgba(0, 0, 0, .3);
  font-family: var(--display); font-size: 28px; letter-spacing: 1px; padding: 6px 14px; transition: transform .08s; }
.ghost-btn:active { transform: translateY(2px); }
.chip { appearance: none; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 16px; border-radius: 999px;
  border: 2px solid var(--edge); background: rgba(0, 0, 0, .3); font-family: var(--label); font-weight: 700; font-size: 18px; letter-spacing: .3px; }
.chip svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--card-ink); }
.chip[hidden] { display: none; }
.round { appearance: none; width: 56px; height: 56px; flex: none; border-radius: 50%; border: 2px solid var(--edge); background: rgba(0, 0, 0, .35);
  display: grid; place-items: center; padding: 0; }
.round svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* read aloud lives in the top-right corner on every screen */
.narrate { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px)); }
.narrate .waves { opacity: .35; }
.narrate[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--card-ink); }
.narrate[aria-pressed="true"] .waves { opacity: 1; }
.narrate[hidden] { display: none; }

/* ---------- home ---------- */
.home { padding-block: 16px 20px; gap: 16px; overflow-y: auto; }
.top { display: flex; align-items: center; gap: 14px; padding-right: 136px; min-height: 56px; }
.logo { flex: 1; margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 4.4vw, 50px); letter-spacing: 2px; line-height: 1; }
.logo span { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.me { appearance: none; display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 14px;
  border: 2px solid var(--gold); background: rgba(0, 0, 0, .35); text-align: left; min-height: 56px; }
.me .shirt { width: 44px; height: 44px; }
.me-name { display: block; font-family: var(--display); font-size: 24px; letter-spacing: 1px; line-height: 1; }
.me-lv { display: block; font-family: var(--label); font-weight: 600; font-size: 15px; color: var(--muted); }
.level { background: var(--panel); border: 2px solid var(--edge); border-radius: 14px; padding: 12px 18px 14px; }
.lv-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.lv-name { font-family: var(--display); font-size: 30px; letter-spacing: 1.5px; line-height: 1; }
.lv-next { font-family: var(--label); font-weight: 600; font-size: 19px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lv-steps { display: flex; gap: 6px; margin-top: 10px; }
.lv-step { flex: 1; height: 14px; border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.lv-step i { display: block; height: 100%; background: var(--gold-grad); border-radius: 999px; }
.lv-labels { display: flex; gap: 6px; margin-top: 6px; }
.lv-labels span { flex: 1; font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); opacity: .7; }
.lv-labels span.on { color: var(--gold-hi); opacity: 1; }
.coach-row { display: flex; align-items: center; gap: 12px; }
.skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.reset { appearance: none; align-self: center; background: none; border: 0; color: var(--muted); font-family: var(--label); font-weight: 600; font-size: 16px; padding: 10px; }
.reset[hidden] { display: none; }

/* a skill card: the shield face is clipped, the button around it keeps a visible focus ring */
.skill { appearance: none; border: 0; padding: 0; background: none; text-align: center; display: flex; border-radius: 10px;
  transition: transform .15s cubic-bezier(.3, 1.5, .5, 1); filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .45)); }
.skill:hover { transform: translateY(-4px); }
.skill:active { transform: translateY(2px) scale(.98); }
.face { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; overflow: hidden;
  padding: 34px 18px 54px; min-height: 360px; color: var(--card-ink);
  clip-path: polygon(50% 0, 100% 7%, 100% 88%, 50% 100%, 0 88%, 0 7%); }
.tier-gold .face { background: var(--gold-grad); }
.tier-silver .face { background: var(--silver-grad); }
.tier-bronze .face { background: var(--bronze-grad); }
.tier-new .face { background: var(--new-grad); color: var(--new-ink); }
.face::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .45) 48%, transparent 60%); transform: translateX(-120%); }
.tier-gold .face::after { animation: shine 4.5s ease-in-out infinite 1s; }
@keyframes shine { 0%, 70% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.sk-head { align-self: stretch; display: flex; justify-content: space-between; align-items: flex-start; padding: 0 4px; }
.sk-rate { font-family: var(--display); font-size: 52px; line-height: .9; font-variant-numeric: tabular-nums; }
.sk-tier { font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: .8; margin-top: 8px; }
.sk-icon { width: clamp(70px, 8vw, 100px); height: clamp(70px, 8vw, 100px); margin: 2px 0 6px; }
.sk-icon svg { width: 100%; height: 100%; }
.sk-title { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 2.6vw, 32px); letter-spacing: 1px; line-height: 1; text-wrap: balance; }
.sk-blurb { font-size: 15px; line-height: 1.35; opacity: .85; flex: 1; text-wrap: pretty; }
.sk-foot { align-self: stretch; display: flex; align-items: center; gap: 8px; }
.skill-stars { font-family: var(--label); font-weight: 700; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.skill-bar { flex: 1; height: 8px; border-radius: 999px; background: rgba(0, 0, 0, .2); overflow: hidden; }
.tier-new .skill-bar { background: rgba(255, 255, 255, .15); }
.skill-bar i { display: block; height: 100%; background: currentColor; border-radius: 999px; }
.skill-go { margin-top: 6px; font-family: var(--display); font-size: 24px; letter-spacing: 1.5px; padding: 6px 22px; border-radius: 12px;
  background: #1B1405; color: var(--gold-hi); }
.tier-new .skill-go { background: var(--gold); color: #1B1405; }

/* ---------- make your player ---------- */
.make { overflow-y: auto; padding-block: 20px; }
.make-in { margin: auto; display: flex; align-items: center; gap: 40px; width: 100%; max-width: 920px; }
.pcard { width: 260px; flex: none; filter: drop-shadow(0 14px 24px rgba(0, 0, 0, .5)); }
.pcard .face { min-height: 370px; background: var(--gold-grad); padding-top: 40px; }
.pc-num { font-family: var(--display); font-size: 64px; line-height: .9; align-self: flex-start; padding-left: 8px; }
.pcard .shirt { width: 130px; height: 130px; margin-top: -24px; }
.pc-name { font-family: var(--display); font-size: 40px; letter-spacing: 1.5px; line-height: 1; text-align: center; overflow-wrap: anywhere; }
.pc-lv { font-family: var(--label); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-size: 15px; opacity: .8; }
.make-form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.make-form h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 52px; letter-spacing: 2px; line-height: 1; }
.make-form .lbl { font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-hi); }
#p-name, #p-fav { width: 100%; min-height: 60px; border-radius: 14px; border: 2px solid var(--edge); background: rgba(0, 0, 0, .35);
  padding: 8px 16px; font-family: var(--display); font-size: 32px; letter-spacing: 1px; }
#p-name::placeholder, #p-fav::placeholder { color: rgba(246, 242, 228, .4); }
.numpick { display: flex; align-items: center; gap: 14px; }
.numpick output { min-width: 80px; text-align: center; font-family: var(--display); font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
.numpick .round { font-family: var(--display); font-size: 34px; }
.make-row { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
.make-row .cta { flex: 1; }
.make-cancel[hidden] { display: none; }

/* ---------- playing ---------- */
.hud { display: flex; align-items: center; gap: 14px; padding-block: 12px; padding-right: 136px; flex-wrap: wrap; border-bottom: 2px solid rgba(227, 179, 65, .35); }
.hud-title { flex: 1; min-width: 180px; display: flex; flex-direction: column; }
.sec-name { font-family: var(--label); font-weight: 700; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
#title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(28px, 3.2vw, 38px); letter-spacing: 1px; line-height: 1; text-wrap: balance; }
.nums { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.pnum { appearance: none; width: 46px; height: 46px; padding: 0; border-radius: 50%; border: 2px solid var(--edge); background: rgba(0, 0, 0, .3);
  font-family: var(--display); font-size: 24px; line-height: 1; }
.pnum.done { background: var(--gold-grad); border-color: transparent; color: var(--card-ink); }
.pnum.current { background: var(--text); border-color: var(--text); color: var(--ground); box-shadow: 0 0 16px rgba(255, 255, 255, .5); }
.total { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 30px; font-variant-numeric: tabular-nums; }
.total svg { width: 26px; height: 26px; fill: var(--gold); }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 30vw, 370px); gap: 18px; padding-block: 16px 18px; }
.field { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
#pitch { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
#pitch:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 12px; }
.side { min-height: 0; overflow-y: auto; background: var(--panel); border: 2px solid var(--edge); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; }
.stack { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.stack[hidden] { display: none; }
.coach-talk { display: flex; flex-direction: column; gap: 10px; }
.coach-talk .bubble::before { content: ""; position: absolute; top: -9px; left: 22px; border: 10px solid transparent; border-top: 0; border-bottom-color: var(--cream); }
.how { margin: 0; display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.4; color: var(--muted); }
.how svg { width: 24px; height: 24px; flex: none; fill: none; stroke: var(--gold-hi); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.controls { display: flex; flex-direction: column; gap: 10px; }
.controls[hidden] { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.push { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
.stars { display: flex; align-items: center; gap: 6px; }
.stars svg { width: 56px; height: 56px; fill: rgba(255, 255, 255, .14); }
.stars svg.on { fill: var(--gold); filter: drop-shadow(0 0 10px rgba(255, 210, 63, .55)); animation: pop .42s cubic-bezier(.3, 1.6, .5, 1) both; }
.stars .of { margin-left: 8px; font-family: var(--display); font-size: 30px; letter-spacing: 1px; color: var(--muted); }
@keyframes pop { from { transform: scale(.2) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checks li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.mark { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #08140D; font-weight: 700; font-size: 16px; }
.mark.ok { background: var(--ok); }
.mark.bad { background: var(--bad); }
.checks strong { display: block; font-weight: 700; font-size: 17px; }
.checks span.why { display: block; font-size: 15px; line-height: 1.4; color: var(--muted); }
.swatch { display: inline-block; width: 14px; height: 14px; border: 2px dashed var(--you-edge); background: rgba(255, 201, 60, .25); border-radius: 3px; vertical-align: -1px; margin-left: 4px; }
.row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.row .cta, .row .ghost-btn { min-height: 64px; font-size: 26px; white-space: nowrap; padding-inline: 10px; }
.tip { font-size: 15px; color: var(--muted); margin: 0; }
.also { font-size: 16px; color: var(--text); }
.also strong { color: var(--gold-hi); }

/* end of a skill */
.end-card { width: 150px; align-self: center; pointer-events: none; }
.end-card .face { min-height: 190px; padding: 20px 10px 32px; gap: 2px; }
.end-card .sk-rate { font-size: 40px; }
.end-card .sk-icon { width: 56px; height: 56px; }
.end-card .sk-title { font-size: 24px; }
#next-skill { font-size: 28px; }
#end { gap: 10px; }
.end-card .sk-blurb { display: none; }
#end-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: 38px; letter-spacing: 1px; line-height: 1; }
.lessons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lessons li { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; line-height: 1.35; }
.lessons .mini { white-space: nowrap; letter-spacing: 1px; color: var(--gold); font-size: 18px; }
.lessons .mini .off { color: rgba(255, 255, 255, .2); }
.prompt-end { margin: 0; font-size: 17px; color: var(--muted); }
/* the coach asks before he tells */
.ask-opts { display: flex; flex-direction: column; gap: 8px; }
.ask-opt { appearance: none; text-align: left; min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--edge);
  background: rgba(0, 0, 0, .3); font-size: 17px; font-weight: 600; line-height: 1.3; }
.ask-opt:disabled { cursor: default; opacity: .55; }
.ask-opt.right { opacity: 1; background: var(--ok); border-color: var(--ok); color: #08140D; }
.ask-opt.wrong { opacity: 1; border-color: var(--bad); }
#coach-talk .bubble::before { left: 22px; }
/* countdown: the pass is on its way */
.clock { display: flex; flex-direction: column; gap: 6px; }
.clock-k { font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold-hi); }
.clock-k b { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--text); }
.clock-bar { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.clock-bar i { display: block; height: 100%; width: 100%; background: var(--gold-grad); border-radius: 999px; }
.clock.hurry .clock-bar i { background: var(--bad); }
/* match mode */
.match { appearance: none; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px 18px; border-radius: 16px;
  border: 2px solid var(--gold); background: linear-gradient(120deg, rgba(227, 179, 65, .22), rgba(0, 0, 0, .3)); min-height: 72px; }
.match-k { font-family: var(--display); font-size: 32px; letter-spacing: 1.5px; line-height: 1; color: var(--gold-hi); }
.match-sub { font-size: 16px; color: var(--muted); }
.end-match { display: flex; align-items: baseline; justify-content: center; white-space: nowrap; font-family: var(--display); font-size: 34px; letter-spacing: 1px; line-height: 1; color: var(--gold-hi); }
/* "Get ready for the game": the bridge from the app to his real match */
.sat { border: 2px dashed var(--gold); border-radius: 14px; padding: 10px 14px; background: rgba(227, 179, 65, .1); }
.sat-k { display: block; font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-hi); }
.sat p { margin: 4px 0 0; font-size: 17px; line-height: 1.4; }
.home-sat p { font-size: 18px; }
.link { appearance: none; background: none; border: 0; color: var(--gold-hi); font-family: var(--label); font-weight: 700; font-size: 18px; padding: 8px 2px; align-self: flex-start; }

/* the shirt badge used on the home chip and the player card */
.shirt text { font-family: var(--display); font-size: 40px; fill: #fff; text-anchor: middle; dominant-baseline: central;
  paint-order: stroke; stroke: rgba(0, 0, 0, .35); stroke-width: 4px; }
.kit-light { --shirt-edge: #1A2330; }
.kit-light .shirt text { fill: #1A2330; stroke: rgba(255, 255, 255, .5); }

/* ---------- 4b: academy, coach, sounds, confetti, card upgrade ---------- */
.sound { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 16px); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 66px); }
.sound[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--card-ink); }
.sound .slash { display: none; }
.sound[aria-pressed="false"] .slash { display: inline; }
.sound[aria-pressed="false"] .note { opacity: .45; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.coach-who { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; }
.coach-tag { font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold-hi); white-space: nowrap; }

<script>
const Engine = (() => {
  const L = 60, W = 40;               // 7v7 pitch in metres, we attack to the right
  const R_INTERCEPT = 2.0;            // a defender this close to the pass line can cut it out
  const SPACE_OPP = 4.0;              // a defender this close to you takes your time away
  const SPACE_MATE = 3.0;             // a teammate this close means you're sharing their space
  const PASS_MIN = 5, PASS_MAX = 25;  // sensible pass lengths for this age
  const EDGE = 0.8;                   // stay this far inside the lines
  const TACKLE = 2.5;                 // a defender this close to the ball can tackle
  const VISION = 80;                  // degrees either side of where you face that you can see
  const BEST_SLACK = 4;               // a safe pass this close to the most forward one is just as good

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function segInfo(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y, len2 = vx * vx + vy * vy;
    if (len2 === 0) return { dist: dist(p, a), t: 0, point: { x: a.x, y: a.y } };
    const t = ((p.x - a.x) * vx + (p.y - a.y) * vy) / len2;
    const tc = Math.max(0, Math.min(1, t));
    const point = { x: a.x + vx * tc, y: a.y + vy * tc };
    return { dist: dist(p, point), t, point };
  }

  const passer = (pz) => pz.mates.find((m) => m.n === pz.ball);

  function blockerOn(from, to, opps) {
    let best = null;
    for (const o of opps) {
      const s = segInfo(o, from, to);
      if (s.t > 0 && s.t < 1 && s.dist < R_INTERCEPT && (!best || s.t < best.t)) {
        best = { opp: o, t: s.t, point: s.point };
      }
    }
    return best;
  }
  const laneBlocker = (pz, you) => blockerOn(passer(pz), you, pz.opps);

  function objective(pz, you, b) {
    const g = pz.goal;
    let ok = false;
    if (g.type === 'zone') ok = you.x >= g.x0 && you.x <= g.x1 && you.y >= g.y0 && you.y <= g.y1;
    else if (g.type === 'spacing') { const dd = dist(b, you); ok = dd >= g.min && dd <= g.max; }
    else if (g.type === 'support') ok = you.x <= b.x + g.ahead && you.x >= b.x - g.behind;
    return { ok, label: g.label, why: ok ? g.ok : g.fail };
  }

  function evaluate(pz, you) {
    const b = passer(pz);
    const len = dist(b, you);
    const blocker = laneBlocker(pz, you);

    let c1;
    if (len < PASS_MIN) c1 = { ok: false, why: `Too close to ${b.name}. You bring your defender with you and there’s no room.` };
    else if (blocker) c1 = { ok: false, why: 'A defender is in the way. You’re hiding in his shadow.' };
    else if (len > PASS_MAX) c1 = { ok: false, why: 'Too far. A pass that long is easy to cut out.' };
    else c1 = { ok: true, why: 'Clear line from the ball to you.' };
    c1.label = `${b.name} can pass to you`;

    const nearOpp = Math.min(...pz.opps.map((o) => dist(o, you)));
    const crowded = pz.mates.filter((m) => m.n !== pz.ball).find((m) => dist(m, you) < SPACE_MATE);
    let c2;
    if (nearOpp < SPACE_OPP) c2 = { ok: false, why: 'A defender is right next to you. He’ll take the ball off you.' };
    else if (crowded) c2 = { ok: false, why: `You’re crowding ${crowded.name}. Spread out.` };
    else c2 = { ok: true, why: 'No one near you. You’ll have time to control it.' };
    c2.label = 'You’ve got space';

    const c3 = objective(pz, you, b);
    const checks = [c1, c2, c3];
    return { checks, stars: checks.filter((c) => c.ok).length, blocker, passLen: len };
  }

  function clamp(pz, p) {
    let x = p.x, y = p.y;
    const dx = x - pz.you.x, dy = y - pz.you.y, r = Math.hypot(dx, dy);
    if (r > pz.run) { x = pz.you.x + (dx / r) * pz.run; y = pz.you.y + (dy / r) * pz.run; }
    x = Math.max(EDGE, Math.min(L - EDGE, x));
    y = Math.max(EDGE, Math.min(W - EDGE, y));
    return { x, y };
  }

  // Every spot you could reach that gets all three checks.
  function openSpace(pz, step = 1) {
    const pts = [];
    for (let x = pz.you.x - pz.run; x <= pz.you.x + pz.run + 1e-9; x += step) {
      for (let y = pz.you.y - pz.run; y <= pz.you.y + pz.run + 1e-9; y += step) {
        if (Math.hypot(x - pz.you.x, y - pz.you.y) > pz.run) continue;
        if (x < EDGE || x > L - EDGE || y < EDGE || y > W - EDGE) continue;
        if (evaluate(pz, { x, y }).stars === 3) pts.push({ x, y });
      }
    }
    return pts;
  }

  // The area each defender blocks: a cone running away from the ball behind him.
  function shadows(pz, from) {
    const b = from || passer(pz);
    return pz.opps.map((o) => {
      const dd = dist(b, o);
      if (dd <= R_INTERCEPT) return null;
      const th = Math.atan2(o.y - b.y, o.x - b.x), a = Math.asin(R_INTERCEPT / dd), near = dd * Math.cos(a);
      const ray = (ang, len) => ({ x: b.x + Math.cos(ang) * len, y: b.y + Math.sin(ang) * len });
      return { opp: o, poly: [ray(th + a, near), ray(th + a, 120), ray(th - a, 120), ray(th - a, near)] };
    }).filter(Boolean);
  }

  const nearestOpp = (pz, p) => pz.opps.reduce((a, o) => (dist(o, p) < dist(a, p) ? o : a), pz.opps[0]);
  const unit = (v) => { const l = Math.hypot(v.x, v.y) || 1; return { x: v.x / l, y: v.y / l }; };

  // ---------- pick the pass: you have the ball ----------
  function passSafe(pz, m) {
    return !blockerOn(pz.you, m, pz.opps) && dist(pz.you, m) <= PASS_MAX && dist(nearestOpp(pz, m), m) >= SPACE_OPP;
  }
  function evaluatePass(pz, n) {
    const m = pz.mates.find((q) => q.n === n), from = pz.you;
    const len = dist(from, m), blocker = blockerOn(from, m, pz.opps);
    let c1;
    if (blocker) c1 = { ok: false, why: 'A defender is in the way. He’ll cut it out.' };
    else if (len > PASS_MAX) c1 = { ok: false, why: 'Too far. A pass that long is easy to cut out.' };
    else c1 = { ok: true, why: 'Clear line all the way to him.' };
    c1.label = `The pass gets to ${m.name}`;
    const c2 = dist(nearestOpp(pz, m), m) < SPACE_OPP
      ? { ok: false, why: `${m.name} has a defender right on him. He’ll lose it.` }
      : { ok: true, why: `${m.name} has space to control it.` };
    c2.label = `${m.name} has space`;
    const safe = pz.mates.filter((q) => passSafe(pz, q));
    const topX = Math.max(...safe.map((q) => q.x));
    const gain = Math.round(m.x - from.x);
    let c3;
    if (c1.ok && c2.ok && m.x >= topX - BEST_SLACK) {
      c3 = { ok: true, why: gain <= 2 ? 'Nothing forward was on, so keeping the ball was the smart choice.'
        : m.x >= topX - 1 ? `It’s the most forward safe pass: ${gain} metres up the pitch.` : `One of the best passes: ${gain} metres up the pitch.` };
    } else if (c1.ok && c2.ok) c3 = { ok: false, why: 'Safe, but there was a pass further forward.' };
    else c3 = { ok: false, why: 'A pass is only good if it gets there safely.' };
    c3.label = 'You picked the best option';
    const checks = [c1, c2, c3];
    return { checks, stars: checks.filter((c) => c.ok).length, blocker, target: m, passLen: len };
  }

  // ---------- check your shoulder: what's behind you is hidden until you look ----------
  function fogged(pz, p) {
    const b = passer(pz);
    return (p.x - pz.you.x) * (b.x - pz.you.x) + (p.y - pz.you.y) * (b.y - pz.you.y) < 0;
  }
  function stanceDir(pz, stance) {
    const b = passer(pz), y = pz.you;
    const toB = unit({ x: b.x - y.x, y: b.y - y.y });
    if (stance === 'face') return toB;
    if (stance === 'back') return { x: -1, y: 0 };
    const toO = unit({ x: pz.open.x - y.x, y: pz.open.y - y.y });
    return unit({ x: toB.x + toO.x, y: toB.y + toO.y });
  }
  function canSee(pz, stance, p) {
    const d = stanceDir(pz, stance), v = unit({ x: p.x - pz.you.x, y: p.y - pz.you.y });
    return Math.acos(Math.max(-1, Math.min(1, d.x * v.x + d.y * v.y))) * 180 / Math.PI <= VISION;
  }
  // A tap on the pitch picks whichever of the three stances points closest to it.
  const STANCES = ['face', 'half', 'back'];
  function nearestStance(pz, p) {
    const v = unit({ x: p.x - pz.you.x, y: p.y - pz.you.y });
    let best = null, bd = -2;
    for (const k of STANCES) { const d = stanceDir(pz, k), c = d.x * v.x + d.y * v.y; if (c > bd) { bd = c; best = k; } }
    return best;
  }
  // What happens after the ball arrives. It follows how you stood, not just the score:
  // half-turn takes a first touch into the space, back to goal shields it and plays it back,
  // facing the passer just controls it. A bad stance means the defender nicks it.
  function scanOutcome(pz, stance) {
    const b = passer(pz), y = pz.you, toB = unit({ x: b.x - y.x, y: b.y - y.y });
    const feet = { x: y.x + toB.x * 1.7, y: y.y + toB.y * 1.7 };
    if (pz.stances[stance].grade === 'bad') {
      const o = nearestOpp(pz, y), side = Math.sign((o.x - y.x) * (b.y - y.y) - (o.y - y.y) * (b.x - y.x)) || 1;
      const perp = { x: -toB.y * side, y: toB.x * side };
      const mid = { x: y.x + (feet.x - y.x) * .55, y: y.y + (feet.y - y.y) * .55 };
      const lunge = { x: mid.x - perp.x * 2.8, y: mid.y - perp.y * 2.8 };
      const away = unit({ x: lunge.x - y.x, y: lunge.y - y.y });
      return { kind: 'lost', you: { ...y }, danger: o, lunge, ball: { x: lunge.x + away.x, y: lunge.y + away.y } };
    }
    if (stance === 'half') {
      const d = unit({ x: pz.open.x - y.x, y: pz.open.y - y.y });
      const touch = { x: y.x + d.x * 3.5, y: y.y + d.y * 3.5 };
      return { kind: 'turn', you: touch, ball: { x: touch.x + d.x * 1.2, y: touch.y + d.y * 1.2 } };
    }
    if (stance === 'back') return { kind: 'layoff', you: { ...y }, ball: feet, to: b };
    return { kind: 'hold', you: { ...y }, ball: feet };
  }

  function evaluateScan(pz, scanned, stance) {
    const s = pz.stances[stance];
    const c1 = scanned
      ? { ok: true, why: 'You looked before the ball came, so you knew what was behind you.' }
      : { ok: false, why: 'You didn’t look. Always check your shoulder before the ball arrives.' };
    c1.label = 'You checked your shoulder';
    const c2 = { ok: s.grade === 'best', why: s.why, label: 'You stood the best way' };
    const c3 = s.grade === 'bad' ? { ok: false, why: 'He got to the ball first.' } : { ok: true, why: 'Your first touch kept it safe.' };
    c3.label = 'You kept the ball';
    const checks = [c1, c2, c3];
    return { checks, stars: checks.filter((c) => c.ok).length, grade: s.grade, danger: nearestOpp(pz, pz.you) };
  }

  // ---------- drive into space: you draw your run ----------
  function pathLength(path) {
    let l = 0;
    for (let i = 1; i < path.length; i++) l += dist(path[i - 1], path[i]);
    return l;
  }
  function samplePath(path, step = 0.25) {
    const pts = [{ ...path[0] }];
    for (let i = 1; i < path.length; i++) {
      const a = path[i - 1], b = path[i], n = Math.max(1, Math.ceil(dist(a, b) / step));
      for (let k = 1; k <= n; k++) pts.push({ x: a.x + ((b.x - a.x) * k) / n, y: a.y + ((b.y - a.y) * k) / n });
    }
    return pts;
  }
  function evaluateDribble(pz, path) {
    const pts = samplePath(path.length ? path : [pz.you]);
    let tackle = null;
    for (let i = 0; i < pts.length && !tackle; i++) {
      for (const o of pz.opps) if (dist(o, pts[i]) < TACKLE) { tackle = { opp: o, index: i, point: pts[i] }; break; }
    }
    const end = tackle ? tackle.point : pts[pts.length - 1];
    const c1 = tackle
      ? { ok: false, why: 'You ran too close to a defender and he tackled you.' }
      : { ok: true, why: 'No defender could reach the ball.' };
    c1.label = 'You stayed out of tackling range';
    let c2;
    if (tackle) c2 = { ok: false, why: 'You lost the ball before you got there.' };
    else if (dist(nearestOpp(pz, end), end) < SPACE_OPP) c2 = { ok: false, why: 'You finished right next to a defender. Stop in the open.' };
    else c2 = { ok: true, why: 'Nobody near you at the end of your run.' };
    c2.label = 'You ended up in space';
    const g = pz.goal, gain = Math.round(end.x - pz.you.x);
    let ok;
    if (tackle) ok = false;
    else if (g.type === 'gain') ok = end.x - pz.you.x >= g.min;
    else ok = end.x >= g.x0 && end.x <= g.x1 && end.y >= g.y0 && end.y <= g.y1;
    const c3 = { ok, label: g.label, why: ok ? g.ok.replace('{gain}', gain) : g.fail };
    const checks = [c1, c2, c3];
    return { checks, stars: checks.filter((c) => c.ok).length, tackle, end, pts };
  }

  // ---------- defend: they have the ball, you pick your spot ----------
  // Our goal is on the left (x = 0). Each defend puzzle picks three of these rules.
  const OUR_GOAL = { x: 0, y: 20 };
  const carrier = (pz) => pz.opps.find((o) => o.n === pz.ball);
  const dangerMan = (pz) => pz.opps.find((o) => o.n === pz.danger);
  const presser = (pz) => pz.mates.find((m) => m.n === pz.presser);
  const angleAt = (at, a, b) => {
    const u = unit({ x: a.x - at.x, y: a.y - at.y }), v = unit({ x: b.x - at.x, y: b.y - at.y });
    return Math.acos(Math.max(-1, Math.min(1, u.x * v.x + u.y * v.y))) * 180 / Math.PI;
  };
  const DEFEND_RULES = {
    lane(pz, you) {
      const d = dangerMan(pz), ok = !!blockerOn(carrier(pz), d, [you]);
      return { ok, label: `You cut out the pass to their #${d.n}`,
        why: ok ? 'You’re standing in the line between the ball and him, so the pass can’t get through.' : `Their #${d.n} is still free for a pass. Stand in the line between the ball and him.` };
    },
    goalside(pz, you) {
      const d = dangerMan(pz), s = segInfo(you, d, OUR_GOAL), ok = s.t > 0 && s.dist <= 3;
      return { ok, label: `You’re goal-side of their #${d.n}`,
        why: ok ? 'You’re between him and our goal, so he can’t run in behind you.' : 'Get between him and our goal. If he’s closer to our goal than you, he’s free.' };
    },
    tight(pz, you) {
      const d = dangerMan(pz), dd = dist(you, d), ok = dd >= 1.5 && dd <= 5;
      return { ok, label: 'You’re close enough to challenge',
        why: ok ? 'If the ball goes to him, you can get there first.' : dd < 1.5 ? 'Too close: one touch and he’s past you. Leave a little gap.' : 'Too far away. Get close enough to win it if it goes to him.' };
    },
    see(pz, you) {
      const ok = angleAt(you, carrier(pz), dangerMan(pz)) <= 90;
      return { ok, label: 'You can see the ball and your man',
        why: ok ? 'You can watch both without turning your head.' : 'Stand so you can see the ball and your man at the same time.' };
    },
    goalsideBall(pz, you) {
      const ok = you.x < carrier(pz).x - 1;
      return { ok, label: 'You’re between the ball and our goal',
        why: ok ? 'The ball is in front of you, where you can deal with it.' : 'The ball is behind you. Get back between it and our goal.' };
    },
    cover(pz, you) {
      const p = presser(pz), dd = dist(you, p), ok = you.x < p.x - 1.5 && dd >= 3 && dd <= 9;
      return { ok, label: `You’re covering ${p.name}`,
        why: ok ? `If he gets past ${p.name}, you’re right there.` : you.x >= p.x - 1.5 ? `Get behind ${p.name}, closer to our goal, so you can help if he’s beaten.` : dd < 3 ? `Too close to ${p.name}: one move beats you both.` : `Too far from ${p.name} to help in time.` };
    },
    inside(pz, you) {
      const ref = pz.presser ? presser(pz) : carrier(pz), ok = Math.abs(you.y - 20) < Math.abs(ref.y - 20) - 0.5;
      const who = pz.presser ? ref.name : 'him';
      return { ok, label: 'You’re on the inside',
        why: ok ? (pz.presser ? `You’re nearer the middle than ${who}, guarding the way to goal.` : 'The middle is closed, so he can only go down the line, away from our goal.') : `Stand nearer the middle of the pitch than ${who}, so the way to goal is shut.` };
    },
    zone(pz, you) {
      const z = pz.zone, ok = you.x >= z.x0 && you.x <= z.x1 && you.y >= z.y0 && you.y <= z.y1;
      return { ok, label: z.label, why: ok ? z.ok : z.fail };
    },
    press(pz, you) {
      const dd = dist(you, carrier(pz)), ok = dd >= 1.5 && dd <= 4.5;
      return { ok, label: 'You pressed the ball',
        why: ok ? 'Close enough to stop him, not so close he can go past you.' : dd < 1.5 ? 'Too close: he’ll knock it past you. Stay an arm’s length away.' : 'Too far away. Close him down!' };
    },
  };
  function evaluateDefend(pz, you) {
    const checks = pz.rules.map((r) => DEFEND_RULES[r](pz, you));
    const stopped = pz.stopIf.every((r) => DEFEND_RULES[r](pz, you).ok);
    return { checks, stars: checks.filter((c) => c.ok).length, stopped, threat: pz.threat };
  }
  // Where the attack goes, and where you win the ball if you stopped it.
  function defendOutcome(pz, you) {
    const c = carrier(pz), to = pz.threat.to, stopped = evaluateDefend(pz, you).stopped;
    if (!stopped) return { stopped, ball: to, carrierTo: pz.threat.kind !== 'pass' ? to : null, dangerTo: pz.threat.kind === 'pass' ? to : null };
    if (pz.threat.kind === 'show') return { stopped, ball: pz.threat.out, carrierTo: pz.threat.out, youTo: { x: pz.threat.out.x - 1.6, y: pz.threat.out.y + 1.6 } };
    const s = segInfo(you, c, to);
    return { stopped, ball: s.point, youTo: s.point };
  }

  // ---------- choose: a decision between a few moves ----------
  // Whether a move is physically safe comes from the picture, not from the puzzle text, so the data can't lie.
  // A "risky" move is a 50/50 (a trick, a take-on): fine near their goal, not near ours.
  const ballHolder = (pz) => (pz.oppBall ? pz.opps.find((o) => o.n === pz.oppBall) : pz.ball ? passer(pz) : pz.you);
  const optEnd = (pz, o) => (o.kind === 'pass' ? pz.mates.find((m) => m.n === o.n) : o.kind === 'shoot' ? o.to : o.path && o.path.length ? o.path[o.path.length - 1] : pz.you);
  function optSafe(pz, o) {
    const end = optEnd(pz, o), mate = (n) => pz.mates.find((m) => m.n === n);
    if (o.kind === 'shoot') return !blockerOn(pz.you, o.to, pz.opps) && dist(pz.you, o.to) <= 22;
    if (o.kind === 'pass') return passSafe(pz, end);
    if (o.kind === 'dribble') {
      const clear = samplePath([pz.you, ...o.path]).every((q) => dist(nearestOpp(pz, q), q) >= TACKLE);
      if (!clear || !o.then) return clear;

    }
    if (o.after) return o.safe !== false;  // pressing or dropping: no ball to lose

    if (!o.receive) return free;
    const from = o.via ? mate(o.via) : ballHolder(pz);
    return free && !blockerOn(from, end, pz.opps) && (!o.via || !blockerOn(ballHolder(pz), from, pz.opps));
  }
  function evaluateChoice(pz, key) {
    const o = pz.options.find((q) => q.key === key), b = pz.options.find((q) => q.key === pz.best);
    const safe = optSafe(pz, o), riskOk = !o.risky || !!pz.riskOk;
    const L3 = pz.labels || ['The right risk', 'It helped the team', 'The best choice'];
    const c1 = { ok: safe && riskOk, label: L3[0],
      why: !safe || !riskOk ? o.why : o.risky ? 'Risky, but up here losing it costs little. Worth a go!' : (pz.safeWhy || 'Nobody could stop it.') };
    const c2 = { ok: !!o.helps, label: L3[1], why: o.helps ? (o.helpsWhy || 'It moved your team on.') : (o.key === b.key ? o.why : 'It didn’t help your team go forward.') };
    const c3 = { ok: o.key === b.key, label: L3[2], why: o.key === b.key ? o.why : `Best was: ${b.label}. ${b.why}` };
    if (!c1.ok && !c2.ok && c1.why === c2.why) c2.why = 'It didn’t help your team go forward.';
    const checks = [c1, c2, c3];
    return { checks, stars: checks.filter((c) => c.ok).length, option: o, safe };
  }

  // ---------- defenders that react: your marker follows you ----------
  // He watches you and chases a spot just goal-side of you (towards their goal), a bit quicker than you,
  // so he can stay with a straight run. But he needs a moment to react: when you start, and every time
  // you change direction sharply, he keeps going the way he was going for a few steps.
  // That's how you lose a marker: go one way, then sprint the other.
  const THEIR_GOAL = { x: 60, y: 20 };
  const REACT_START = 0.8, REACT_TURN = 2.6, MARKER_SPEED = 1.15, GOALSIDE = 1.3, TURN_DEG = 60;
  function follow(pz, path) {
    const pts = samplePath(path.length ? path : [pz.you]), m0 = pz.opps.find((o) => o.n === pz.marker);
    let m = { x: m0.x, y: m0.y }, vel = { x: 0, y: 0 }, committed = null, frozen = REACT_START, turns = 0;
    const track = [{ ...m }];
    for (let i = 1; i < pts.length; i++) {
      const v = { x: pts[i].x - pts[i - 1].x, y: pts[i].y - pts[i - 1].y }, l = Math.hypot(v.x, v.y);
      if (l < 1e-9) { track.push({ ...m }); continue; }
      const h = { x: v.x / l, y: v.y / l };
      if (committed && Math.acos(Math.max(-1, Math.min(1, h.x * committed.x + h.y * committed.y))) * 180 / Math.PI > TURN_DEG) { frozen = REACT_TURN; turns++; }
      committed = h;
      if (frozen > 0) {
        m = { x: m.x + vel.x * l, y: m.y + vel.y * l };  // still going the old way
        frozen -= l;
      } else {
        const g = unit({ x: THEIR_GOAL.x - pts[i].x, y: THEIR_GOAL.y - pts[i].y });
        const target = { x: pts[i].x + g.x * GOALSIDE, y: pts[i].y + g.y * GOALSIDE };
        const d = dist(m, target), k = d > 1e-9 ? Math.min(1, (l * MARKER_SPEED) / d) : 0;
        const nm = { x: m.x + (target.x - m.x) * k, y: m.y + (target.y - m.y) * k };
        vel = { x: (nm.x - m.x) / l, y: (nm.y - m.y) / l };
        m = nm;
      }
      m = { x: Math.max(EDGE, Math.min(L - EDGE, m.x)), y: Math.max(EDGE, Math.min(W - EDGE, m.y)) };
      track.push({ ...m });
    }
    return { pts, track, end: pts[pts.length - 1], marker: m, turns };
  }
  function evaluateMove(pz, path) {
    const f = follow(pz, path), end = f.end, b = passer(pz);
    const opps = pz.opps.map((o) => (o.n === pz.marker ? { ...o, x: f.marker.x, y: f.marker.y } : o));
    const near = (p) => Math.min(...opps.map((o) => dist(o, p)));
    let checks;
    if (pz.goal.type === 'decoy') {
      const t = pz.mates.find((m) => m.n === pz.target), moved = dist(f.marker, pz.opps.find((o) => o.n === pz.marker));
      const c1 = { ok: moved >= 4, label: 'Your defender followed you', why: moved >= 4 ? 'He went with you, out of the way.' : 'He didn’t need to move. Make a run he has to follow.' };
      const free = !blockerOn(b, t, opps) && near(t) >= SPACE_OPP;
      const c2 = { ok: free, label: `${t.name} is free`, why: free ? `The pass to ${t.name} is wide open.` : `${t.name} still isn’t free for a pass.` };
      const inWay = !!blockerOn(b, t, [end]) || dist(end, t) < SPACE_MATE;
      const c3 = { ok: !inWay, label: `You stayed out of ${t.name}’s way`, why: inWay ? `You ended up in ${t.name}’s space, or in the way of the pass.` : `You took him away from ${t.name}, not towards him.` };
      checks = [c1, c2, c3];
    } else {
      const len = dist(b, end), blk = blockerOn(b, end, opps);
      const c1 = { ok: !blk && len >= PASS_MIN && len <= PASS_MAX, label: `${b.name} can pass to you`, why: blk ? 'A defender is still in the way of the pass.' : len < PASS_MIN ? `Too close to ${b.name}.` : len > PASS_MAX ? 'Too far for a pass.' : 'Clear line from the ball to you.' };
      const sp = near(end) >= SPACE_OPP;
      const c2 = { ok: sp, label: 'You lost your marker', why: sp ? 'He couldn’t keep up when you changed direction.' : 'He’s still right with you. Go one way, then sprint the other.' };
      const z = pz.goal, inZ = end.x >= z.x0 && end.x <= z.x1 && end.y >= z.y0 && end.y <= z.y1;
      const c3 = { ok: inZ, label: z.label, why: inZ ? z.ok : z.fail };
      checks = [c1, c2, c3];
    }
    return { checks, stars: checks.filter((c) => c.ok).length, follow: f, end };
  }

        o.frequency.value = 2800; l.frequency.value = 38; lg.gain.value = 120;
        l.connect(lg); lg.connect(o.frequency); env(a, g, t + s0, d, 0.1); o.connect(g); g.connect(a.destination);
        o.start(t + s0); l.start(t + s0); o.stop(t + s0 + d + 0.03); l.stop(t + s0 + d + 0.03);
      }
    },
  };
  function sfx(name, arg) {
    if (!soundOn) return;
    sfxCount++; document.documentElement.dataset.sfx = String(sfxCount);
    const a = audio();
    if (!a) return;
    try { SFX[name](a, a.currentTime + 0.01, arg || 0); } catch (e) { /* sound is a nice-to-have */ }
  }

  // Where a pass ends up: at the receiver's feet, at the defender who cuts it out, or short if it's too far.
  function passTarget(from, target, r) {
    if (r.blocker) {
      const p = r.blocker.point, d = E.dist(p, from) || 1;
      return { x: p.x - ((p.x - from.x) / d) * 1.6, y: p.y - ((p.y - from.y) / d) * 1.6 };
    }
    if (r.checks[0].ok) return feetOf(target, from);
    const len = E.dist(from, target);
    if (len > E.PASS_MAX) return lerp(from, target, (len - 4) / len);
    return null;
  }
  // Kick, then the ball rolls along a gold trail and slows as it arrives.
  function playPass(from, target, r, done, kicker) {
    const to = passTarget(from, target, r);
    if (!to) { done(); return; }
    const start = ballHomeFrom(from);
    setBall(start);
    bump(kicker, 'kick'); sfx('kick');
    const trail = el('line', { x1: start.x, y1: start.y, x2: start.x, y2: start.y, class: 'trail' }, L.fx);
    wait(230, () => tween(450 + E.dist(start, to) * 38, (t) => {
      const p = lerp(start, to, 1 - (1 - t) * (1 - t));
      setBall(p); trail.setAttribute('x2', p.x); trail.setAttribute('y2', p.y);
    }, () => { trail.remove(); done(); }));
  }
  function landedPass(from, target, r, receiver, quiet) {
    setBall(passTarget(from, target, r) || ballHomeFrom(from));
    oppEls.forEach((g) => g.classList.remove('caught'));
    if (r.blocker) oppEls.get(r.blocker.opp).classList.add('caught');
    else if (r.checks[0].ok && !quiet) bump(receiver, 'receive');
  }

  // ---------- drawing ----------
  // A player seen from above: shoulders, hands and head, all turned the way he faces.
  // Real proportions (Reuven picked option C: person with feet). The shirt number sits just behind him and stays upright.
  function figure(g, n) {
    const a = el('g', { class: 'anim' }, el('g', { class: 'pose' }, g));
    el('ellipse', { class: 'foot', cx: .95, cy: -.4, rx: .36, ry: .2 }, a);
    el('ellipse', { class: 'foot', cx: .6, cy: .4, rx: .36, ry: .2 }, a);
    el('circle', { class: 'hand', cx: .3, cy: -1.28, r: .3 }, a);
    el('circle', { class: 'hand', cx: .3, cy: 1.28, r: .3 }, a);
    el('ellipse', { class: 'torso', cx: 0, cy: 0, rx: .6, ry: 1.3 }, a);
    el('circle', { class: 'head', cx: .12, cy: 0, r: .56 }, a);
    el('text', { class: 'num' }, g).textContent = n;
  }
  const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
  function setFace(g, ang) {
    if (!g) return;
    const deg = (ang * 180) / Math.PI, k = g === youG ? 1.15 : 1;
    g.querySelector('.pose').setAttribute('transform', `rotate(${deg.toFixed(1)}) scale(${k})`);
    const num = g.querySelector('.num');
    num.setAttribute('x', (-Math.cos(ang) * 1.3 * k).toFixed(2));
    num.setAttribute('y', (-Math.sin(ang) * 1.3 * k).toFixed(2));
  }
  // Which way you face: towards the ball, where you're about to pass or run, or the stance you picked.
  function youAngle() {
    const at = shownYou || you;
    if (pz.type === 'scan' && stance) { const d = E.stanceDir(pz, stance); return Math.atan2(d.y, d.x); }
    if (pz.type === 'space' || pz.type === 'scan') return angTo(at, E.passer(pz));
    if (pz.type === 'defend') return angTo(at, E.carrier(pz));
    if (pz.type === 'move') return state === 'setup' && path.length > 1 ? angTo(path[0], path[Math.min(3, path.length - 1)]) : angTo(at, E.passer(pz));
    if (pz.type === 'choice') {
      const o = pick && pz.options.find((q) => q.key === pick), h = E.ballHolder(pz);
      if (o && state === 'setup') return angTo(at, E.optEnd(pz, o) === pz.you ? h : E.optEnd(pz, o));
      return h === pz.you ? 0 : angTo(at, h);
    }
    if (pz.type === 'pass') { const m = pz.mates.find((q) => q.n === pick); return m ? angTo(at, m) : 0; }
    if (pz.type === 'dribble' && state === 'setup' && path.length > 1) return angTo(path[0], path[Math.min(3, path.length - 1)]);
    return 0;
  }
  // Everyone else watches the ball. Whoever has it looks at you.
  function facePlayers() {
    const h = holder(), ball = h === pz.you ? (shownYou || you) : h;
    oppEls.forEach((g, o) => setFace(g, pz.type === 'defend' && o === h ? angTo(o, pz.threat.to) : angTo(o, ball)));
    mateEls.forEach((g, m) => setFace(g, angTo(m, m === h ? (shownYou || you) : ball)));
  }

  function drawPlayers() {
    L.players.replaceChildren();
    oppEls = new Map(); mateEls = new Map();
    for (const o of pz.opps) {
      const g = el('g', { class: 'tok them', transform: tr(o) }, L.players);
      if (pz.danger === o.n || pz.marker === o.n) { el('circle', { class: 'dangerring', r: 2.15 }, g); }
      figure(g, o.n);
      if (pz.danger === o.n) el('text', { class: 'name danger-name setup-only', y: -2.6 }, g).textContent = 'Danger';
      if (pz.marker === o.n) el('text', { class: 'name danger-name setup-only', y: -2.6 }, g).textContent = 'Your marker';
      oppEls.set(o, g);
    }
    for (const m of pz.mates) {
      const g = el('g', { class: 'tok us' + (pick === m.n ? ' picked' : ''), transform: tr(m) }, L.players);
      el('circle', { class: 'pickring', r: 2.15 }, g);
      figure(g, m.n);
      el('text', { class: 'name', y: 2.6 }, g).textContent = m.name;
      mateEls.set(m, g);
    }
    ballEl = el('circle', { class: 'ball', r: .62 }, L.players);
    setBall(ballHomeFrom(holder()));
    youG = el('g', { class: 'tok you' }, L.players);
    el('circle', { class: 'halo', r: 2.1 }, youG);
    figure(youG, playerNum());
    el('text', { class: 'name you-name', y: 2.95 }, youG).textContent = 'You';
    el('circle', { class: 'hit', r: 3.2 }, youG);
    facePlayers();
    updateHidden();
  }

  function updateHidden() {
    const hide = (p) => pz.type === 'scan' && !scanned && state !== 'result' && E.fogged(pz, p);
    oppEls.forEach((g, o) => g.classList.toggle('hid', hide(o)));
    mateEls.forEach((g, m) => g.classList.toggle('hid', hide(m)));
  }

  function placeYou() {
    youG.setAttribute('transform', tr(shownYou || you));
    setFace(youG, youAngle());
  }

  function drawLane(from, to, r) {
    const line = (a, z, cls) => el('line', { x1: a.x, y1: a.y, x2: z.x, y2: z.y, class: cls }, L.lane);
    if (state === 'playing') return;
    if (state === 'setup' || !r) { line(from, to, 'lane-plan'); return; }
    if (r.blocker) { line(from, r.blocker.point, 'lane-cut'); line(r.blocker.point, to, 'lane-rest'); }
    else if (r.checks[0].ok) line(from, to, 'lane-open');
    else line(from, to, 'lane-meh');
  }

  function drawShadows(from, hot) {
    for (const s of E.shadows(pz, from)) {
      const cls = s.opp === hot ? 'shadow hot' : 'shadow';
      el('polygon', { points: ptsAttr(s.poly), class: cls }, L.shadows);
      el('circle', { cx: s.opp.x, cy: s.opp.y, r: E.R_INTERCEPT, class: cls }, L.shadows);
    }
  }

  function drawRect(x0, y0, x1, y1) {
    el('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, class: 'zone' }, L.zone);
  }

  // ---------- the four puzzle types ----------
  const TYPES = {
    space: {
      how: 'Drag yourself (gold) or tap a spot inside the dashed circle.',
      primary: 'Check my spot',
      hint: ['Show defenders’ shadows', 'Hide defenders’ shadows'],
      extra: ['Show all the open space', 'Hide the open space'],
      extraTip: 'Tap a gold dot to watch the pass go there.',
      drag: true,
      ready: () => true,
      down(p) { dragging = true; moveYou(p); },
      move(p) { moveYou(p); },
      draw() {
        const b = E.passer(pz);
        if (state === 'setup') {
          el('circle', { cx: pz.you.x, cy: pz.you.y, r: pz.run, class: 'run' }, L.run);
          el('circle', { cx: pz.you.x, cy: pz.you.y, r: 1.25, class: 'ghost' }, L.run);
        }
        if (hint || state === 'result') drawShadows(b, res && res.blocker ? res.blocker.opp : null);
        if (state === 'result') {
          const g = pz.goal;
          if (g.type === 'zone') drawRect(g.x0, g.y0, g.x1, g.y1);
          else if (g.type === 'support') drawRect(b.x - g.behind, 0, b.x + g.ahead, 40);
          else if (g.type === 'spacing') {
            const ring = (r) => `M${b.x - r} ${b.y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
            el('path', { d: ring(g.max) + ring(g.min), 'fill-rule': 'evenodd', class: 'zone', 'clip-path': 'url(#pc)' }, L.zone);
          }
        }
        spacePts = state === 'result' && extra ? E.openSpace(pz, 1) : [];
        for (const p of spacePts) el('circle', { cx: p.x, cy: p.y, r: .36, class: 'dot' }, L.space);
        drawLane(b, you, res);
      },
      submit() { res = E.evaluate(pz, you); },
      play(done) { playPass(E.passer(pz), you, res, done, mateEls.get(E.passer(pz))); },
      final(quiet) { landedPass(E.passer(pz), you, res, youG, quiet); },
      hasReplay: () => !!passTarget(E.passer(pz), you, res),
      extraTap(p) {
        let q = null, bd = 1.6;
        for (const s of spacePts) { const d = E.dist(s, p); if (d < bd) { bd = d; q = s; } }
        if (!q) return;
        L.fx.replaceChildren();
        el('circle', { cx: q.x, cy: q.y, r: 1.4, class: 'demo-ring' }, L.fx);
        oppEls.forEach((g) => g.classList.remove('caught'));
        const b = E.passer(pz), r = E.evaluate(pz, q);
        playPass(b, q, r, () => landedPass(b, q, r, null, true), mateEls.get(b));
      },
    },

    pass: {
      how: 'You have the ball. Tap the teammate you’d pass to.',
      primary: 'Make the pass',
      hint: ['Show defenders’ shadows', 'Hide defenders’ shadows'],
      extra: ['Show all my passes', 'Hide my passes'],
      extraTip: 'Tap any teammate to watch that pass.',
      ready: () => pick !== null,
      down(p) {
        const m = nearestMate(p, 3);
        if (!m) return;
        pick = m.n;
        mateEls.forEach((g, q) => g.classList.toggle('picked', q.n === pick));
        render(); updatePrimary();
      },
      draw() {
        if (hint || state === 'result') drawShadows(pz.you, res && res.blocker ? res.blocker.opp : null);
        const m = pz.mates.find((q) => q.n === pick);
        if (m) drawLane(pz.you, m, state === 'result' ? res : null);
        if (state === 'result' && extra) {
          for (const q of pz.mates) {
            if (q.n === pick) continue;
            const r = E.evaluatePass(pz, q.n);
            if (r.blocker) {
              el('line', { x1: pz.you.x, y1: pz.you.y, x2: r.blocker.point.x, y2: r.blocker.point.y, class: 'lane-cut thin' }, L.space);
            } else {
              el('line', { x1: pz.you.x, y1: pz.you.y, x2: q.x, y2: q.y, class: r.stars === 3 ? 'lane-open thin' : r.stars === 2 ? 'lane-ok' : 'lane-meh' }, L.space);
            }
          }
          for (const q of pz.mates) {
            const s = E.evaluatePass(pz, q.n).stars;
            el('text', { x: q.x, y: q.y - 2.3, class: 'starlbl' + (s < 2 ? ' none' : '') }, L.fx).textContent = s ? '★'.repeat(s) : '✕';
          }
        }
      },
      submit() { res = E.evaluatePass(pz, pick); },
      play(done) { playPass(pz.you, res.target, res, done, youG); },
      final(quiet) { landedPass(pz.you, res.target, res, mateEls.get(res.target), quiet); },
      hasReplay: () => true,
      extraTap(p) {
        const m = nearestMate(p, 3);
        if (!m) return;
        const r = E.evaluatePass(pz, m.n);
        oppEls.forEach((g) => g.classList.remove('caught'));
        playPass(pz.you, m, r, () => landedPass(pz.you, m, r, mateEls.get(m)), youG);
      },
    },

    scan: {
      how: 'Tap the dark area to look behind you. Then tap an arrow to turn.',
      primary: 'Receive the ball',
      hint: null, extra: null,
      ready: () => !!stance,
      // Arrows first (one can sit in the dark area), then the dark area, then anywhere else snaps to the nearest arrow.
      down(p) {
        const hit = E.STANCES.find((k) => E.dist(arrowAt(k), p) < 2);
        if (hit) { setStance(hit); return; }
        if (!scanned && E.fogged(pz, p)) { doScan(); return; }
        if (E.dist(p, you) > 1.5) setStance(E.nearestStance(pz, p));
      },
      draw() {
        if (!scanned && state !== 'result') drawFog();
        if (stance) drawVision();
        drawLane(E.passer(pz), you, state === 'result' ? { checks: [{ ok: true }] } : null);
        if (state === 'setup') drawArrows();
        if (state === 'result' && E.scanOutcome(pz, stance).kind === 'turn') {
          el('line', { x1: you.x, y1: you.y, x2: pz.open.x, y2: pz.open.y, class: 'lane-plan' }, L.lane);
        }
      },
      submit() { res = E.evaluateScan(pz, scanned, stance); },
      // What happens next follows how he stood: turn into space, shield and play it back, or just control it.
      play(done) {
        const b = E.passer(pz), out = E.scanOutcome(pz, stance), ok = { checks: [{ ok: true }] };
        playPass(b, you, ok, () => {
          bump(youG, 'receive');
          if (out.kind === 'turn') {
            tween(450, (t) => { const p = lerp(you, out.you, t); youG.setAttribute('transform', tr(p)); setBall(lerp(feetOf(you, b), out.ball, t)); }, done);
          } else if (out.kind === 'lost') {
            const g = oppEls.get(out.danger), from = { x: out.danger.x, y: out.danger.y }, ball0 = feetOf(you, b);
            wait(120, () => tween(380, (t) => { g.setAttribute('transform', tr(lerp(from, out.lunge, t))); if (t > .6) setBall(lerp(ball0, out.ball, (t - .6) / .4)); }, done));
          } else if (out.kind === 'layoff') {
            wait(380, () => playPass(you, b, ok, () => { bump(mateEls.get(b), 'receive'); done(); }, youG));
          } else wait(200, done);
        }, mateEls.get(b));
      },
      final() {
        const b = E.passer(pz), out = E.scanOutcome(pz, stance);
        if (out.kind === 'turn') { shownYou = out.you; placeYou(); }
        if (out.kind === 'lost') { const g = oppEls.get(out.danger); g.setAttribute('transform', tr(out.lunge)); g.classList.add('caught'); }
        setBall(out.kind === 'layoff' ? feetOf(b, you) : out.ball);
      },
      hasReplay: () => true,
    },

    defend: {
      how: 'You’re defending. Drag yourself (gold) or tap a spot inside the dashed circle.',
      primary: 'Defend!',
      hint: ['Show their attack', 'Hide their attack'],
      extra: null,
      drag: true,
      ready: () => true,
      down(p) { dragging = true; moveYou(p); },
      move(p) { moveYou(p); },
      draw() {
        const c = E.carrier(pz), to = pz.threat.to;
        if (state === 'setup') {
          el('circle', { cx: pz.you.x, cy: pz.you.y, r: pz.run, class: 'run' }, L.run);
          el('circle', { cx: pz.you.x, cy: pz.you.y, r: 1.25, class: 'ghost' }, L.run);
        }
        if (hint || state === 'result') {
          el('line', { x1: c.x, y1: c.y, x2: to.x, y2: to.y, class: 'threat' }, L.lane);
          const d = dir(c, to), n = { x: -d.y, y: d.x };
          el('polygon', { points: ptsAttr([add(to, d, .6), add(to, n, .55), add(to, n, -.55)]), class: 'threat-head' }, L.lane);
        }
        if (state === 'result' && pz.zone) drawRect(pz.zone.x0, pz.zone.y0, pz.zone.x1, pz.zone.y1);
      },
      submit() { res = E.evaluateDefend(pz, you); },
      // Final positions: where the ball, the attacker(s) and you end up.
      plan() {
        const c = E.carrier(pz), out = E.defendOutcome(pz, you), d = pz.danger ? E.dangerMan(pz) : null;
        const pl = { c, d, ball: out.ball, carrierTo: out.carrierTo || null, dangerTo: out.dangerTo || null, youTo: null };
        if (out.stopped && pz.threat.kind === 'pass') { pl.youTo = out.youTo; pl.ball = add(out.youTo, dir(out.youTo, c), 1.0); }
        if (out.stopped && pz.threat.kind === 'dribble') {
          pl.carrierTo = out.ball; pl.youTo = add(out.ball, dir(out.ball, you), 1.6); pl.ball = lerp(pl.carrierTo, pl.youTo, .5);
        }
        if (out.stopped && pz.threat.kind === 'show') { pl.carrierTo = pz.threat.out; pl.youTo = add(pz.threat.out, dir(pz.threat.out, you), 2.2); pl.ball = add(pz.threat.out, dir(c, pz.threat.out), 1.1); }
        if (!out.stopped && pz.threat.kind !== 'pass') pl.ball = add(out.ball, dir(c, out.ball), 1.1);
        return pl;
      },
      play(done) {
        const pl = this.plan(), gC = oppEls.get(pl.c), gD = pl.d && oppEls.get(pl.d), ball0 = ballHomeFrom(pl.c), y0 = { ...you };
        const step = (t) => {
          const e = 1 - (1 - t) * (1 - t);
          if (pl.carrierTo) { const p = lerp(pl.c, pl.carrierTo, e); gC.setAttribute('transform', tr(p)); setFace(gC, angTo(pl.c, pl.carrierTo)); }
          if (pl.dangerTo && gD) gD.setAttribute('transform', tr(lerp(pl.d, pl.dangerTo, e)));
          if (pl.youTo) { youG.setAttribute('transform', tr(lerp(y0, pl.youTo, Math.min(1, e * 1.4)))); }
          setBall(lerp(ball0, pl.ball, e));
        };
        if (pz.threat.kind === 'pass') { bump(gC, 'kick'); sfx('kick'); wait(230, () => tween(650 + E.dist(ball0, pl.ball) * 30, step, done)); }
        else tween(1000, step, done);
      },
      final() {
        const pl = this.plan();
        if (pl.carrierTo) { const g = oppEls.get(pl.c); g.setAttribute('transform', tr(pl.carrierTo)); setFace(g, angTo(pl.c, pl.carrierTo)); }
        if (pl.dangerTo && pl.d) oppEls.get(pl.d).setAttribute('transform', tr(pl.dangerTo));
        if (pl.youTo) { shownYou = pl.youTo; placeYou(); }
        setBall(pl.ball);
        oppEls.forEach((g) => g.classList.remove('caught'));
        if (!res.stopped) (oppEls.get(pl.d) || oppEls.get(pl.c)).classList.add('caught');
      },
      hasReplay: () => true,
    },

    choice: {
      how: 'Tap the move you’d make, then tap Do it!',
      primary: 'Do it!',
      hint: null, extra: null,
      ready: () => pick !== null,
      controls(box) {
        for (const o of pz.options) {
          const b = document.createElement('button');
          b.className = 'opt-btn'; b.dataset.key = o.key; b.textContent = o.label;
          b.setAttribute('aria-pressed', String(pick === o.key));
          b.addEventListener('click', () => {
            if (state !== 'setup' || anim) return;
            unlockSpeech();
            pick = o.key; render(); updatePrimary();
            box.querySelectorAll('.opt-btn').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.key === pick)));
          });
          box.appendChild(b);
        }
      },
      draw() {
        const h = E.ballHolder(pz);
        for (const o of pz.options) {
          const on = pick === o.key;
          if (state !== 'setup' && !on) continue;
          const cls = on ? ' on' : '', end = E.optEnd(pz, o);
          if (o.kind === 'pass' || o.kind === 'shoot') el('line', { x1: pz.you.x, y1: pz.you.y, x2: end.x, y2: end.y, class: 'opt-line' + cls }, L.lane);
          else if (o.path.length) {
            const pts = [pz.you, ...o.path], a = pts[pts.length - 2], d = dir(a, end), n = { x: -d.y, y: d.x };
            el('polyline', { points: ptsAttr(pts), class: 'opt-line' + (o.kind === 'run' ? ' run-opt' : '') + cls }, L.path);
            el('polygon', { points: ptsAttr([add(end, d, .7), add(end, n, .55), add(end, n, -.55)]), class: 'opt-head' + cls }, L.path);
          } else el('circle', { cx: pz.you.x, cy: pz.you.y, r: 2.6, class: 'opt-ring' + cls }, L.path);
          if (o.then) { const m = pz.mates.find((q) => q.n === o.then); el('line', { x1: end.x, y1: end.y, x2: m.x, y2: m.y, class: 'opt-line then' + cls }, L.lane); }
          if (o.receive && on) {
            const via = o.via && pz.mates.find((q) => q.n === o.via);
            if (via) el('line', { x1: h.x, y1: h.y, x2: via.x, y2: via.y, class: 'opt-line then on' }, L.lane);
            const from = via || h;
            el('line', { x1: from.x, y1: from.y, x2: end.x, y2: end.y, class: 'opt-line then on' }, L.lane);
          }
          if (state === 'setup') {
            const lab = o.path && !o.path.length ? { x: pz.you.x, y: pz.you.y + 4.4 } : { x: end.x, y: Math.max(1.6, end.y - 2.4) };
            el('text', { x: lab.x.toFixed(2), y: lab.y.toFixed(2), class: 'opt-label' + cls }, L.fx).textContent = o.label;
          }
        }
      },
      submit() { res = E.evaluateChoice(pz, pick); },
      // Where everything ends up for the chosen move.
      plan() {
        const o = res.option, h = E.ballHolder(pz), mate = (n) => pz.mates.find((q) => q.n === n);
        const pl = { o, you: { ...pz.you }, ball: ballHomeFrom(h), lunger: null, steps: [] };
        if (o.kind === 'pass' || o.kind === 'shoot') {
          const to = o.kind === 'pass' ? mate(o.n) : o.to, blk = E.blockerOn(pz.you, to, pz.opps);
          const r = { blocker: blk, checks: [{ ok: !blk }] };
          pl.ball = blk ? passTarget(pz.you, to, r) : o.kind === 'shoot' ? to : feetOf(to, pz.you);
          pl.steps.push({ pass: [pz.you, to, r, o.kind === 'pass' ? mate(o.n) : null] });
        } else if (o.kind === 'dribble') {
          const pts = E.samplePath([pz.you, ...o.path]);
          let k = pts.findIndex((q) => E.dist(E.nearestOpp(pz, q), q) < E.TACKLE);
          const lost = k >= 0 || (o.risky && !pz.riskOk);
          if (k < 0) k = lost ? Math.floor(pts.length * .6) : pts.length - 1;
          pl.pts = pts.slice(0, k + 1); pl.you = pts[k];
          if (lost) {
            const op = E.nearestOpp(pz, pl.you), pos = add(pl.you, dir(pl.you, op), 1.5);
            pl.lunger = { opp: op, pos }; pl.ball = add(pos, dir(pl.you, pos), 1.1);
          } else if (o.then) { pl.ball = feetOf(mate(o.then), pl.you); pl.steps.push({ pass: [pl.you, mate(o.then), { checks: [{ ok: true }] }, mate(o.then)] }); }
          else pl.ball = add(pl.you, dir(pts[Math.max(0, k - 3)], pl.you), 1.2);
        } else {
          const end = E.optEnd(pz, o);
          pl.you = { ...end }; pl.pts = E.samplePath([pz.you, ...o.path]);
          if (o.receive) {
            const via = o.via && mate(o.via), from = via || h;
            if (res.safe) {
              if (via) pl.steps.push({ pass: [h, via, { checks: [{ ok: true }] }, via] });
              pl.steps.push({ pass: [from, end, { checks: [{ ok: true }] }, 'you'] });
              pl.ball = feetOf(end, from);
            }
          }
          if (o.after === 'win') { pl.ball = add(end, dir(end, h), 1.0); pl.steps.push({ win: true }); }
          if (o.after === 'lose') { pl.ball = o.passTo; pl.steps.push({ pass: [h, o.passTo, { checks: [{ ok: true }] }, null], quiet: true }); }
        }
        return pl;
      },
      play(done) {
        const pl = this.plan(), h = E.ballHolder(pz);
        const runSteps = (i) => {
          if (i >= pl.steps.length) { done(); return; }
          const st = pl.steps[i];
          if (st.win) { const b0 = ballHomeFrom(h); tween(260, (t) => setBall(lerp(b0, pl.ball, t)), () => runSteps(i + 1)); return; }
          const [from, to, r, recv] = st.pass;
          const g = recv === 'you' ? youG : recv ? mateEls.get(recv) : null;
          const kick = from === pz.you || (pl.pts && from === pl.you) ? youG : mateEls.get(pz.mates.find((q) => q === from)) || oppEls.get(pz.opps.find((q) => q === from));
          if (pl.o.kind === 'shoot' && !r.blocker) {
            const b0 = ballHomeFrom(pz.you); bump(youG, 'kick'); sfx('kick');
            wait(200, () => tween(520, (t) => setBall(lerp(b0, to, 1 - (1 - t) * (1 - t))), () => runSteps(i + 1)));
            return;
          }
          playPass(from, to, r, () => { if (g && !r.blocker) bump(g, 'receive'); if (r.blocker) oppEls.get(r.blocker.opp).classList.add('caught'); runSteps(i + 1); }, kick);
        };
        if (pl.pts && pl.pts.length > 1) {
          const n = pl.pts.length - 1, withBall = pl.o.kind === 'dribble';
          tween(260 + n * 22, (t) => {
            const q = pl.pts[Math.round(t * n)];
            youG.setAttribute('transform', tr(q)); setFace(youG, angTo(pz.you, pl.you));
            if (withBall) setBall(add(q, dir(pz.you, pl.you), 1.2));
          }, () => {
            if (pl.lunger) {
              const g = oppEls.get(pl.lunger.opp), from = { x: pl.lunger.opp.x, y: pl.lunger.opp.y }, b0 = add(pl.you, dir(pz.you, pl.you), 1.2);
              tween(320, (t) => { g.setAttribute('transform', tr(lerp(from, pl.lunger.pos, t))); setBall(lerp(b0, pl.ball, t)); }, done);
            } else runSteps(0);
          });
        } else runSteps(0);
      },
      final() {
        const pl = this.plan();
        shownYou = pl.you; placeYou();
        oppEls.forEach((g) => g.classList.remove('caught'));
        if (pl.lunger) { const g = oppEls.get(pl.lunger.opp); g.setAttribute('transform', tr(pl.lunger.pos)); g.classList.add('caught'); }
        for (const st of pl.steps) if (st.pass && st.pass[2].blocker) oppEls.get(st.pass[2].blocker.opp).classList.add('caught');
        if (pl.o.after === 'win') oppEls.get(E.ballHolder(pz)).classList.add('caught');  // he lost it to you

      },
      hasReplay: () => true,
    },

    move: {
      how: () => `Draw your run with your finger, starting from you. Up to ${pz.maxRun} metres. Careful: your marker follows you!`,
      primary: 'Go!',
      hint: null, extra: null,
      drag: true,
      ready: () => E.pathLength(path) >= 2,
      down(p) { dragging = true; path = [{ ...pz.you }]; extendPath(p); render(); updatePrimary(); },
      move(p) { extendPath(p); render(); updatePrimary(); },
      draw() {
        if (state === 'result' && pz.goal.type === 'zone') drawRect(pz.goal.x0, pz.goal.y0, pz.goal.x1, pz.goal.y1);
        if (state === 'result' && res) {
          el('polyline', { points: ptsAttr(res.follow.pts), class: 'run-path done' }, L.path);
          el('polyline', { points: ptsAttr(res.follow.track), class: 'run-path rest' }, L.path);
          if (pz.target) { const t = pz.mates.find((m) => m.n === pz.target), b = E.passer(pz); el('line', { x1: b.x, y1: b.y, x2: t.x, y2: t.y, class: res.checks[1].ok ? 'lane-open' : 'lane-cut' }, L.lane); }
        } else if (path.length > 1) {

          const a = path[Math.max(0, path.length - 3)], z = path[path.length - 1], d = dir(a, z), n = { x: -d.y, y: d.x };
          el('polygon', { points: ptsAttr([add(z, d, .9), add(z, n, .65), add(z, n, -.65)]), class: 'arrowhead' }, L.path);
        }
      },
      submit() { res = E.evaluateMove(pz, path.length > 1 ? path : [pz.you]); },
      // After the run, the ball goes to whoever is free, or gets cut out.
      pass() {
        const b = E.passer(pz), mk = pz.opps.find((o) => o.n === pz.marker);
        const moved = pz.opps.map((o) => (o === mk ? { ...o, x: res.follow.marker.x, y: res.follow.marker.y } : o));
        const to = pz.target ? pz.mates.find((m) => m.n === pz.target) : res.end;
        const ok = pz.target ? res.checks[1].ok : res.checks[0].ok && res.checks[1].ok;
        let blk = ok ? null : E.blockerOn(b, to, moved);
        if (blk) blk = { point: blk.point, opp: blk.opp.n === pz.marker ? mk : blk.opp };
        else if (!ok) { const near = E.nearestOpp({ opps: moved }, to); blk = { point: near, opp: near.n === pz.marker ? mk : near }; }
        return { b, to, r: { blocker: blk, checks: [{ ok }] }, recv: pz.target ? mateEls.get(to) : youG };
      },
      play(done) {
        const f = res.follow, n = f.pts.length - 1, gm = oppEls.get(pz.opps.find((o) => o.n === pz.marker));
        tween(300 + n * 22, (t) => {
          const k = Math.round(t * n);
          youG.setAttribute('transform', tr(f.pts[k])); gm.setAttribute('transform', tr(f.track[k]));
          setFace(youG, angTo(f.pts[Math.max(0, k - 2)], f.pts[k])); setFace(gm, angTo(f.track[k], f.pts[k]));

        });
      },
      final() {
        const f = res.follow, gm = oppEls.get(pz.opps.find((o) => o.n === pz.marker));
        shownYou = f.end; placeYou();
        gm.setAttribute('transform', tr(f.marker)); setFace(gm, angTo(f.marker, f.end));

  function moveYou(p) { you = nudge(E.clamp(pz, p)); render(); }

  // Keep "you" from landing on top of another player.
  function nudge(p) {
    let q = { ...p };
    for (let k = 0; k < 3; k++) {
      for (const o of [...pz.mates, ...pz.opps]) {
        const d = E.dist(o, q);
        if (d < 2.6) {
          const ux = d ? (q.x - o.x) / d : 1, uy = d ? (q.y - o.y) / d : 0;
          q = E.clamp(pz, { x: o.x + ux * 2.6, y: o.y + uy * 2.6 });
        }
      }
    }
    return q;
  }

  function extendPath(p) {
    const q = { x: Math.max(E.EDGE, Math.min(60 - E.EDGE, p.x)), y: Math.max(E.EDGE, Math.min(40 - E.EDGE, p.y)) };
    const last = path[path.length - 1], d = E.dist(last, q);
    if (d < .5) return;
    const left = pz.maxRun - E.pathLength(path);
    if (left <= .05) return;
    path.push(d > left ? lerp(last, q, left / d) : q);
  }

  function drawFog() {
    const b = E.passer(pz), u = dir(you, b), n = { x: -u.y, y: u.x }, F = 120;

    el('line', { x1: P(F, 0).x, y1: P(F, 0).y, x2: P(-F, 0).x, y2: P(-F, 0).y, class: 'fog-edge' }, L.fog);
    const lp = P(0, 9), lx = Math.max(7, Math.min(53, lp.x)), ly = Math.max(3, Math.min(35.5, lp.y));

  // Three arrows round you on the pitch, one for each way to stand. Tap one to turn that way.

  const TIER_LABEL = { gold: 'Gold', silver: 'Silver', bronze: 'Bronze', new: 'New' };

  }
  const SKILL_ICON = {

  // ---------- countdown: you only have a few seconds before the pass arrives ----------
  let clock = null, waiting = false;
  function stopClock() { if (clock) { clearInterval(clock); clock = null; } }
  function startClock() {
    unlockSpeech();
    waiting = false;
    $('check').textContent = T().primary; updatePrimary();
    const dur = pz.countdown * 1000, t0 = performance.now();

    clock = setInterval(() => {
      const left = Math.max(0, dur - (performance.now() - t0));
      $('clock-fill').style.width = `${(100 * left) / dur}%`;
      $('clock-n').textContent = `${Math.ceil(left / 1000)}`;
      $('clock').classList.toggle('hurry', left < 2500);
      if (left <= 0) {
        stopClock(); sfx('whistle');

  // ---------- Match mode: a mix from every skill, missed and not-seen-lately puzzles first ----------
  const SEEN_KEY = 'fts-seen-v1';
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; } catch (e) { seen = {}; }
  function markSeen(id) { seen[id] = Date.now(); try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) { /* private mode */ } }
  const matchStars = {};
  function buildMatch(n = 5) {
    const rank = (i) => (tried[i] && best[i] < 3 ? 0 : !tried[i] ? 1 : 2);
    const order = E.PUZZLES.map((_, i) => i).map((i) => ({ i, r: rank(i), t: seen[E.PUZZLES[i].id] || 0, z: Math.random() }))
      .sort((a, b) => a.r - b.r || a.t - b.t || a.z - b.z).map((x) => x.i);
    const out = [], per = {};
    for (const i of order) {  // no more than 2 from one skill, and not the same skill twice in a row
      const s2 = E.PUZZLES[i].section;
      if (out.length >= n) break;
      if ((per[s2] || 0) >= 2 || (out.length && E.PUZZLES[out[out.length - 1]].section === s2)) continue;
      out.push(i); per[s2] = (per[s2] || 0) + 1;
    }
    for (const i of order) if (out.length < n && !out.includes(i)) out.push(i);
    return out;
  }
  function startMatch() {
    if (anim) return;

    for (const k in matchStars) delete matchStars[k];
